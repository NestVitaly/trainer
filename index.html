<style>

</style></head><body><div id="app">
<div id="setup" class="card"><h1>Покер-тренер</h1>
<p>Техасский холдем, стек 1000, блайнды 10/20. Играй против ботов, после каждой раздачи получай разбор решений: префлоп, постфлоп, позиция, размеры ставок.</p>
<div class="row">Сколько ботов (1 — хедз-ап, максимум 6 игроков за столом): <span id="nb"></span></div>
<button id="go" class="pr">Начать игру</button><button id="st0">Моя статистика</button><button id="gl0">Справочник</button></div>
<div id="game" hidden>
<div class="top"><span id="hn"></span><span><button id="gl1">Справочник</button><button id="st1">Статистика</button><button id="rs">Выйти</button></span></div>
<div id="opps"></div><div id="tbl"></div><div id="me"></div><div id="act"></div>
<div id="log"></div><div id="an" class="card" hidden></div></div>
<div id="stats" class="card" hidden></div>
<div id="gloss" class="card" hidden></div>
</div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SU=['♠','♥','♦','♣'],RN='..23456789TJQKA',rk=c=>2+(c>>2),su=c=>c&3;
const cs=c=>RN[rk(c)].replace('T','10')+SU[su(c)];
const cd=c=>'<span class="c'+(su(c)==1||su(c)==2?' r':'')+'">'+cs(c)+'</span>';
const HN=['Старшая карта','Пара','Две пары','Сет','Стрит','Флеш','Фулл-хаус','Каре','Стрит-флеш'];
const NAMES=['Макс','Анна','Игорь','Лена','Олег'],BB=20,SB=10;
const POS={2:['BTN','BB'],6:['BTN','SB','BB','UTG','MP','CO'],3:['BTN','SB','BB'],4:['BTN','SB','BB','CO'],5:['BTN','SB','BB','UTG','CO']};
const THR={UTG:8,MP:7,CO:6,BTN:5,SB:6,BB:0},ICON={ok:'✅',warn:'⚠️',bad:'❌'};
function fresh(){return{h:0,net:0,v:0,pf:0,ag:0,cl:0,fc:0,fb:0,pos:{},q:{}}}
function load(){try{return JSON.parse(localStorage.getItem('pk'))||fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem('pk',JSON.stringify(S))}catch(e){}}
let S=load(),P=[],D=-1,B=[],cur=0,minR=BB,street='',hn=0,DEC=[],LOG=[],nBots=3,busy=false;
function deck(){const d=[...Array(52).keys()];for(let i=51;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return d}
function ev5(c){
 const r=c.map(rk).sort((a,b)=>b-a),fl=c.every(x=>su(x)==su(c[0])),cnt={};
 r.forEach(x=>cnt[x]=(cnt[x]||0)+1);
 const g=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]||b-a);
 const wheel=g.length==5&&r[0]==14&&r[1]==5,st=g.length==5&&(r[0]-r[4]==4||wheel);
 const k=g.map(x=>cnt[x]).join('');
 const cat=st&&fl?8:k=='41'?7:k=='32'?6:fl?5:st?4:k=='311'?3:k=='221'?2:k=='2111'?1:0;
 let o=[];g.forEach(x=>{for(let i=0;i<cnt[x];i++)o.push(x)});
 if(wheel)o=[5,4,3,2,1];
 return o.reduce((a,x)=>a*15+x,cat);
}
function best(c){let m=0;const n=c.length;
 for(let a=0;a<n-4;a++)for(let b=a+1;b<n-3;b++)for(let d=b+1;d<n-2;d++)for(let e=d+1;e<n-1;e++)for(let f=e+1;f<n;f++){const v=ev5([c[a],c[b],c[d],c[e],c[f]]);if(v>m)m=v}
 return m}
function equity(h,bd,n,it){
 const used=new Set([...h,...bd]),rest=[...Array(52).keys()].filter(x=>!used.has(x)),k=5-bd.length;let w=0;
 for(let t=0;t<it;t++){const d=rest.slice(),need=k+2*n;
  for(let i=0;i<need;i++){const j=i+(Math.random()*(d.length-i)|0);[d[i],d[j]]=[d[j],d[i]]}
  const b=bd.concat(d.slice(0,k)),me=best(h.concat(b));let win=1,tie=1;
  for(let o=0;o<n;o++){const v=best([d[k+2*o],d[k+2*o+1]].concat(b));if(v>me){win=0;break}if(v==me)tie++}
  if(win)w+=1/tie}
 return w/it}
function chen(h){let a=rk(h[0]),b=rk(h[1]);if(a<b)[a,b]=[b,a];
 const pt=x=>x==14?10:x==13?8:x==12?7:x==11?6:x/2;let s=pt(a);
 if(a==b)return Math.max(5,s*2);
 if(su(h[0])==su(h[1]))s+=2;const g=a-b-1;s-=g<=0?0:g==1?1:g==2?2:g==3?4:5;
 if(g<=1&&a<12)s+=1;return Math.ceil(s)}
const pot=()=>P.reduce((s,p)=>s+p.tot,0),alive=()=>P.filter(p=>!p.fold);
const r5=x=>Math.round(x/5)*5;
function note(p,s){p.last=s;LOG.push(street+': '+p.name+' '+s);$('#log').innerHTML=LOG.slice(-6).join('<br>')}
function post(i,a){const p=P[i],x=Math.min(a,p.stack);p.stack-=x;p.bet=x;p.tot=x;if(!p.stack)p.all=true}
function apply(p,a){
 const tc=cur-p.bet;let t=a.t;
 if(t=='fold'&&tc==0)t='call';
 if(t=='raise'&&p.bet+p.stack<=cur)t='call';
 if(t=='fold'){p.fold=true;p.acted=true;note(p,'фолд');return}
 if(t=='call'){const x=Math.min(tc,p.stack);p.stack-=x;p.bet+=x;p.tot+=x;if(!p.stack)p.all=true;p.acted=true;note(p,tc?'колл '+x:'чек');return}
 let to=Math.min(Math.max(a.to,cur+minR),p.bet+p.stack);
 const bet0=cur==0,x=to-p.bet;p.stack-=x;p.bet=to;p.tot+=x;if(!p.stack)p.all=true;
 if(to-cur>=minR)minR=to-cur;
 cur=to;P.forEach(q=>{if(q!=p)q.acted=false});p.acted=true;
 note(p,(bet0?'бет ':'рейз до ')+to+(p.all?' (олл-ин)':''))}
async function botAct(p){
 await sleep(600);
 const tc=cur-p.bet,pt=pot(),pf=street=='Префлоп',n=alive().length-1,r=Math.random();
 const mk=f=>({t:'raise',to:r5(cur+f*(pt+tc))});
 if(pf){
  const c=chen(p.hole)+(p.pos=='BTN'||p.pos=='CO'?1:0)+Math.round(Math.random()*2-1);
  if(cur<=BB){
   if(c>=9||(c>=6&&r<.45*p.agg))return{t:'raise',to:r5(BB*(2.5+r))};
   return c>=5||tc==0?{t:'call'}:{t:'fold'}}
  if(c>=12)return{t:'raise',to:r5(cur*3)};
  return c>=8||(c>=6&&tc<=3*BB&&r<.3)?{t:'call'}:{t:'fold'}}
 const eq=equity(p.hole,B,n,150),po=tc/(pt+tc);
 if(tc==0){
  if(eq>.62)return mk(.4+r*.3);
  if(eq>.45&&r<.5)return mk(.33);
  return r<.1*p.agg?mk(.5):{t:'call'}}
 if(eq>.78&&r<.6)return mk(.7);
 return eq*.94>po+.03||r<.06?{t:'call'}:{t:'fold'}}
function humanAct(p){return new Promise(res=>ui(p,a=>{record(p,a);res(a)}))}
function ui(p,cb){
 const tc=cur-p.bet,mx=p.bet+p.stack,mn=Math.min(cur+minR,mx),pt=pot(),A=$('#act'),pf=street=='Префлоп';
 let h='<div class="hint">Твой ход. Банк '+pt+(tc?', доплатить '+Math.min(tc,p.stack):'')+'</div><div class="row">';
 if(tc>0)h+='<button id="bf">Фолд</button>';
 h+='<button id="bc" class="pr">'+(tc?'Колл '+Math.min(tc,p.stack):'Чек')+'</button></div>';
 const canR=p.stack>tc;
 if(canR){
  const qs=pf?[2.5,3,4].map(m=>['×'+m,r5(cur*m)]):[[.33,'⅓'],[.5,'½'],[.75,'¾'],[1,'банк']].map(q=>[q[1],r5(cur+q[0]*(pt+tc))]);
  h+='<div class="row">'+qs.map(q=>'<button class="q" data-v="'+q[1]+'">'+q[0]+'</button>').join('')+'<button class="q" data-v="'+mx+'">Олл-ин</button></div>';
  h+='<div class="row"><input type="range" id="sl" aria-label="Размер ставки"><button id="br" class="pr"></button></div>'}
 A.innerHTML=h;
 const done=a=>{A.innerHTML='';cb(a)};
 if($('#bf'))$('#bf').onclick=()=>done({t:'fold'});
 $('#bc').onclick=()=>done({t:'call'});
 if(canR){const sl=$('#sl'),br=$('#br');sl.min=mn;sl.max=mx;sl.step=5;sl.value=mn;
  const upd=()=>{const v=+sl.value>=mx-2?mx:+sl.value;br.textContent=(v>=mx?'Олл-ин ':cur?'Рейз до ':'Бет ')+v;br.dataset.v=v};
  sl.oninput=upd;upd();
  A.querySelectorAll('.q').forEach(b=>b.onclick=()=>{sl.value=Math.min(mx,Math.max(mn,+b.dataset.v));upd()});
  br.onclick=()=>done({t:'raise',to:+br.dataset.v})}}
function record(p,a){
 const pf=street=='Префлоп',tc=cur-p.bet,opp=alive().length-1,pt=pot();
 const ord=q=>(P.indexOf(q)-D-1+P.length)%P.length;
 const ip=alive().every(q=>q==p||ord(q)<ord(p));
 let eq=null;
 if(!pf){eq=equity(p.hole,B,opp,500);if(tc>0)eq*=.92}
 const to=a.t=='raise'?Math.min(a.to,p.bet+p.stack):0;
 const r=a.t=='raise'?(to-p.bet-tc)/(pt+tc):0;
 const at=a.t=='fold'?(tc?'фолд':'чек'):a.t=='call'?(tc?'колл '+tc:'чек'):(cur?'рейз до ':'бет ')+to;
 DEC.push({st:street,pos:p.pos,ip,hole:p.hole.slice(),board:B.slice(),pot:pt,tc,t:a.t=='fold'&&!tc?'call':a.t,to,r,eq,ch:chen(p.hole),cur,at,
  hs:p.hole.map(cs).join(' '),bs:B.map(cs).join(' ')})}
const OK=s=>({m:'ok',s}),W=s=>({m:'warn',s}),X=s=>({m:'bad',s});
function judge(d){
 const pc=x=>Math.round(x*100)+'%';
 if(d.st=='Префлоп'){const th=THR[d.pos];
  if(d.cur<=BB){
   if(d.t=='fold')return d.ch>=th+3?W('Слишком тесно: с такой рукой с позиции '+d.pos+' можно входить в игру.'):OK('Фолд слабой руки с этой позиции — правильно.');
   if(d.t=='call')return d.tc==0?OK('Чек на большом блайнде: бесплатный флоп.'):d.ch>=9?W('Лимп сильной рукой. Лучше рейз до 2.5–3 BB: берёшь инициативу и наращиваешь банк, пока ты впереди.'):d.ch>=th?W('Лимп — слабая линия, ты отдаёшь инициативу. Обычно лучше рейз или фолд.'):X('Лимп слабой рукой с позиции '+d.pos+'. Лучше фолд.');
   if(d.ch<th-1)return W('Рейз слабой рукой с позиции '+d.pos+': за тобой ещё играют. Нормально только как редкий стил с поздней позиции.');
   return d.to>4*BB?W('Рейз слишком крупный. Стандарт: 2.5–3 BB.'):OK('Хороший рейз: рука подходит, размер разумный.')}
  if(d.t=='fold')return d.ch>=10?W('Фолд сильной руки против рейза — слишком осторожно.'):OK('Фолд слабой руки против рейза — правильно.');
  if(d.t=='call')return d.ch<7?X('Колл рейза слабой рукой: дальше будешь играть без позиции и с отстающей рукой.'):OK('Колл рейза рукой достаточной силы.');
  return d.ch>=11?OK('3-бет сильной рукой — хорошо.'):d.ch>=8?W('3-бет средней рукой: возможен, но как редкий блеф.'):X('3-бет слабой рукой — это чистый блеф. Делай его редко.')}
 const e=d.eq,po=d.tc/(d.pot+d.tc),r=d.r;
 if(d.tc>0){
  if(d.t=='fold')return e>po+.1?X('Фолд зря: оценка эквити ~'+pc(e)+', для колла хватило бы '+pc(po)+'.'):OK('Фолд обоснован: эквити ~'+pc(e)+' при нужных '+pc(po)+'.');
  if(d.t=='call')return e<po-.12?X('Колл невыгоден: эквити ~'+pc(e)+', нужно '+pc(po)+'.'):e<po-.04?W('Колл на грани: эквити ~'+pc(e)+', нужно '+pc(po)+'.'):OK('Колл оправдан: эквити ~'+pc(e)+' при нужных '+pc(po)+'.');
  if(d.st=='Ривер'&&e<.6)return X('Рейз на ривере средней рукой. Хуже тебя не платят, лучше платят всегда. Обычно правильнее колл.');
  return e<.4?W('Рейз слабой рукой — это блеф. Допустим редко и с хорошей историей раздачи.'):OK('Рейз сильной рукой — нормально.')}
 if(d.t=='call')return e>.65?W('Чек сильной рукой: упускаешь вэлью. Ставь 40–60% банка.'):OK('Чек разумен: рука не требует ставки.');
 if(e<.35)return r>.8?W('Блеф слишком крупный: хватит ½–⅔ банка.'):OK('Небольшой блеф или полублеф — приемлемо, если делать нечасто.');
 if(e>.6&&r<.3)return W('Ставка мала для сильной руки: ставь 40–60% банка.');
 if(e<.6&&r>.75)return W('Раздутая ставка средней рукой: хуже тебя сбросят, лучше заплатят.');
 return r>1.1&&e<.85?W('Овербет без нужной силы.'):OK('Размер ставки согласован с силой руки.')}
async function round(first){
 let i=first;const n=P.length;
 for(let g=0;g<300;g++){
  const lv=P.filter(p=>!p.fold&&!p.all);
  if(alive().length<2||!lv.length)return;
  if(lv.length==1&&lv[0].bet>=cur)return;
  if(lv.every(p=>p.acted&&p.bet==cur))return;
  const p=P[i++%n];
  if(p.fold||p.all||(p.acted&&p.bet==cur))continue;
  render();
  const a=p.h?await humanAct(p):await botAct(p);
  apply(p,a)}}
async function playHand(){
 busy=true;hn++;$('#an').hidden=true;$('#act').innerHTML='';LOG=[];DEC=[];B=[];
 const n=P.length,dk=deck();
 P.forEach(p=>{if(p.stack<=0)p.stack=1000;p.hole=[dk.pop(),dk.pop()];p.bet=0;p.tot=0;p.fold=false;p.all=false;p.acted=false;p.last='';p.s0=p.stack});
 D=(D+1)%n;P.forEach((p,i)=>p.pos=POS[n][(i-D+n)%n]);
 const hp=S.pos[P[0].pos]||(S.pos[P[0].pos]={h:0,v:0});hp.h++;
 post(n==2?D:(D+1)%n,SB);post(n==2?(D+1)%2:(D+2)%n,BB);cur=BB;minR=BB;
 for(const st of ['Префлоп','Флоп','Тёрн','Ривер']){
  street=st;
  if(st=='Флоп')B.push(dk.pop(),dk.pop(),dk.pop());else if(st!='Префлоп')B.push(dk.pop());
  if(st!='Префлоп'){P.forEach(p=>{p.bet=0;p.acted=false;p.last=''});cur=0;minR=BB}
  render();
  if(alive().length>1&&P.filter(p=>!p.fold&&!p.all).length>1)await round(st=='Префлоп'?(n==2?D:(D+3)%n):(D+1)%n);
  else if(alive().length>1)await sleep(800);
  if(alive().length<2)break}
 await showdown()}
async function showdown(){
 const al=alive(),sc=new Map(),res=[];
 al.forEach(p=>sc.set(p,al.length>1?best(p.hole.concat(B)):0));
 let prev=0;
 while(P.some(p=>p.tot>prev)){
  const e=al.filter(p=>p.tot>prev);if(!e.length)break;
  const cap=Math.min(...e.map(p=>p.tot)),pt=P.reduce((s,p)=>s+Math.max(0,Math.min(p.tot,cap)-prev),0);
  const top=Math.max(...e.map(p=>sc.get(p))),w=e.filter(p=>sc.get(p)==top),sh=Math.floor(pt/w.length);
  w.forEach(p=>p.stack+=sh);w[0].stack+=pt-sh*w.length;
  w.forEach(p=>res.push(p.name+' выигрывает '+sh+(al.length>1?' ('+HN[Math.floor(top/759375)]+')':'')));prev=cap}
 street='Итог';render(al.length>1);
 LOG.push('<b>'+res.join('; ')+'</b>');$('#log').innerHTML=LOG.slice(-6).join('<br>');
 const net=P[0].stack-P[0].s0;finish(net);busy=false}
function finish(net){
 S.h++;S.net+=net;let vp=0,pr=0;const qa=k=>S.q[k]||(S.q[k]=[0,0,0]);
 DEC.forEach(d=>{d.j=judge(d);const i=d.j.m=='ok'?0:d.j.m=='warn'?1:2;qa(d.st)[i]++;
  if(d.st!='Префлоп'){qa(d.ip?'IP':'OOP')[i]++;if(d.t=='raise')S.ag++;else if(d.t=='call'&&d.tc>0)S.cl++;if(d.tc>0){S.fc++;if(d.t=='fold')S.fb++}}
  else{if(d.t=='raise')pr=1;if(d.t=='raise'||(d.t=='call'&&d.tc>0))vp=1}});

 const hs=['setup','game'].filter(x=>!$('#'+x).hidden);$('#stats').hidden=false;$('#setup').hidden=true;$('#game').hidden=true;
 const bar=a=>{const t=a[0]+a[1]+a[2];return t?'<div class="bar"><span style="width:'+pct(a[0],t)+'%;background:var(--ok)"></span><span style="width:'+pct(a[1],t)+'%;background:var(--wn)"></span><span style="width:'+pct(a[2],t)+'%;background:var(--bad)"></span></div><small>верно '+pct(a[0],t)+'% · спорно '+pct(a[1],t)+'% · ошибки '+pct(a[2],t)+'% (решений: '+t+')</small>':'<small>нет данных</small>'};
 const v=pct(S.v,S.h),p=pct(S.pf,S.h),fb=pct(S.fb,S.fc),ag=S.cl?(S.ag/S.cl).toFixed(1):S.ag;
 const adv=[];

 else{if(v>45)adv.push('Ты играешь слишком много рук (VPIP '+v+'%). Чаще фолдь слабые руки.');

  if(ti>4&&to>4&&pct(oo[0],to)<pct(io[0],ti)-15)adv.push('Без позиции ты ошибаешься заметно чаще, чем в позиции. Играй осторожнее, когда ходишь первым.');

 +['Префлоп','Флоп','Тёрн','Ривер','IP','OOP'].map(k=>'<p><b>'+({IP:'В позиции',OOP:'Без позиции'}[k]||k)+'</b>'+bar(S.q[k]||[0,0,0])+'</p>').join('')
 +'<p><b>По позициям</b></p><table>'+Object.keys(S.pos).map(k=>'<tr><td>'+k+'</td><td>'+S.pos[k].h+' раздач, VPIP '+pct(S.pos[k].v,S.pos[k].h)+'%</td></tr>').join('')+'</table><h3>Что подтянуть</h3>'+adv.map(a=>'<p>'+a+'</p>').join('')
 +'<p><small>Оценки приблизительные: эквити считается симуляцией против случайных рук, это не точный анализ GTO.</small></p><div class="row"><button id="back" class="pr">Назад</button><button id="clr">Сбросить статистику</button></div>';
